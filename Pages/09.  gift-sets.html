<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Sets &amp; Discovery Kits &mdash; OMNISCENT</title>

    <!-- Meta tags for SEO & Theme (Matches 01. homepage.html & 02. shop.html) -->
    <meta name="description" content="Discover the Art of Gifting with OMNISCENT luxury fragrance gift sets and curated discovery kits.">
    <meta name="theme-color" content="#F6ECE5">

    <!-- Google Fonts Preconnect & Stylesheets (Matches existing pages) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">

    <!-- Shared & Page Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gift-sets.css">
</head>
<body>

    <!-- =======================================================================
         1. SITE HEADER / NAVIGATION BAR (Consistent with 01. homepage & 02. shop)
         ======================================================================= -->
    <header class="site-header" id="siteHeader">
        <div class="nav-container">

            <!-- Brand Logo & Name -->
            <a href="01.  homepage.html" class="brand-logo" aria-label="Omniscent Homepage">
                <img src="../images/logo.png" alt="Omniscent Emblem" class="brand-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <svg class="brand-icon brand-icon-fallback" viewBox="0 0 64 64" aria-hidden="true">
                    <defs>
                        <linearGradient id="omniscentRose" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#D9918F"/>
                            <stop offset="55%" stop-color="#C77A73"/>
                            <stop offset="100%" stop-color="#8C4343"/>
                        </linearGradient>
                    </defs>
                    <circle cx="32" cy="36" r="18" fill="none" stroke="url(#omniscentRose)" stroke-width="2.5"/>
                    <rect x="26" y="14" width="12" height="5" rx="2" fill="url(#omniscentRose)"/>
                    <rect x="29" y="19" width="6" height="4" fill="#8C4343"/>
                    <path d="M20 35c2-6 8-10 14-8 4 1 6 5 4 9-2 3-7 3-8 7 4 0 8-2 11-6" fill="none" stroke="url(#omniscentRose)" stroke-width="2.4" stroke-linecap="round"/>
                    <circle cx="44" cy="49" r="3.5" fill="#C77A73"/>
                </svg>
                <span class="brand-name">OMNISCENT</span>
            </a>

            <!-- Central Navigation -->
            <nav class="nav-center" aria-label="Main Navigation">
                <a href="02.  shop.html" class="nav-pill">
                    <span>Shop All</span>
                    <span class="dropdown-arrow" aria-hidden="true">&#9662;</span>
                </a>
                <span class="nav-divider" aria-hidden="true">|</span>
                <a href="02.  shop.html?category=men" class="nav-link">Men</a>
                <span class="nav-divider" aria-hidden="true">|</span>
                <a href="02.  shop.html?category=women" class="nav-link">Women</a>
                <span class="nav-divider" aria-hidden="true">|</span>
                <a href="02.  shop.html?category=unisex" class="nav-link">Unisex</a>
            </nav>

            <!-- Right Actions (Search & Shopping Bag with Counter) -->
            <div class="nav-right">
                <span class="nav-divider-light" aria-hidden="true">|</span>

                <!-- Search Button -->
                <button class="nav-action-btn search-btn" id="searchBtn" type="button" aria-label="Search Fragrances">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>

                <!-- Shopping Bag / Cart Button -->
                <a href="11.  cart.html" class="nav-action-btn cart-btn" id="cartBtn" aria-label="Shopping Bag">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </a>

                <!-- Mobile Menu Hamburger Toggle -->
                <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle Navigation Menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation Drawer -->
        <div class="mobile-nav-drawer" id="mobileNav" aria-hidden="true">
            <a href="01.  homepage.html" class="mobile-nav-link">Home</a>
            <a href="02.  shop.html" class="mobile-nav-link">Shop All</a>
            <a href="02.  shop.html?category=men" class="mobile-nav-link">Men</a>
            <a href="02.  shop.html?category=women" class="mobile-nav-link">Women</a>
            <a href="02.  shop.html?category=unisex" class="mobile-nav-link">Unisex</a>
            <a href="09.  gift-sets.html" class="mobile-nav-link active" aria-current="page">Gift Sets</a>
        </div>
    </header>

    <!-- =======================================================================
         2. MAIN CONTENT AREA — HERO SECTION ONLY
         ======================================================================= -->
    <main>
        <section class="hero-section gift-hero-section" id="gift-sets-hero" aria-labelledby="giftHeroTitle">
            <div class="gift-hero-wrap">

                <!-- Left Column: Tagline, Heading, Description & Explore Collection CTA -->
                <div class="hero-content">
                    <div class="hero-tagline">
                        <span>GIFT SETS &amp; DISCOVERY KITS</span>
                        <span class="tagline-line" aria-hidden="true"></span>
                    </div>

                    <h1 class="hero-title" id="giftHeroTitle">
                        Discover the Art of<br>
                        <span class="accent-italic">Gifting</span>
                    </h1>

                    <p class="hero-description">
                        Curated luxury fragrance boxes and discovery kits crafted to make every gesture unforgettable.
                    </p>

                    <a href="#exclusive-collection" class="btn-primary" id="exploreCollectionBtn">
                        <span>Explore Collection</span>
                        <span class="btn-arrow" aria-hidden="true">&rarr;</span>
                    </a>
                </div>

                <!-- Right Column: Gift-Box Visual Area (Temporary SVG Placeholder matching Page 09 sketch) -->
                <div class="gift-hero-visual">
                    <div class="gift-box-placeholder" role="img" aria-label="Curated luxury gift boxes illustration">
                        <svg class="gift-box-illustration" viewBox="0 0 440 340" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <defs>
                                <radialGradient id="giftGlow" cx="50%" cy="46%" r="50%">
                                    <stop offset="0%" stop-color="#FAF4F0" stop-opacity="0.95"/>
                                    <stop offset="65%" stop-color="#ECCFC6" stop-opacity="0.35"/>
                                    <stop offset="100%" stop-color="#E8D8CF" stop-opacity="0"/>
                                </radialGradient>
                                <linearGradient id="boxBodyGrad" x1="130" y1="120" x2="310" y2="255" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#FAF4F0"/>
                                    <stop offset="100%" stop-color="#E8D8CF"/>
                                </linearGradient>
                                <linearGradient id="boxLidGrad" x1="120" y1="95" x2="320" y2="132" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#FDF8F5"/>
                                    <stop offset="100%" stop-color="#ECCFC6"/>
                                </linearGradient>
                                <linearGradient id="roseRibbonGrad" x1="170" y1="60" x2="270" y2="260" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#D9918F"/>
                                    <stop offset="55%" stop-color="#C77A73"/>
                                    <stop offset="100%" stop-color="#B66A64"/>
                                </linearGradient>
                            </defs>

                            <!-- Soft ambient glow -->
                            <circle cx="220" cy="170" r="145" fill="url(#giftGlow)"/>

                            <!-- Left & right botanical sprigs (inspired by Page 09 sketch) -->
                            <g stroke="#B66A64" stroke-width="1.4" stroke-linecap="round" opacity="0.72">
                                <path d="M98 205 C82 178, 76 150, 86 122"/>
                                <path d="M84 172 C70 166, 62 156, 60 144"/>
                                <ellipse cx="59" cy="141" rx="6" ry="3.5" transform="rotate(-35 59 141)" fill="#ECCFC6" stroke="#C77A73"/>
                                <ellipse cx="87" cy="118" rx="6.5" ry="3.5" transform="rotate(20 87 118)" fill="#ECCFC6" stroke="#C77A73"/>
                                <ellipse cx="97" cy="150" rx="5.5" ry="3" transform="rotate(40 97 150)" fill="#FAF4F0" stroke="#C77A73"/>

                                <path d="M342 205 C358 178, 364 150, 354 122"/>
                                <path d="M356 172 C370 166, 378 156, 380 144"/>
                                <ellipse cx="381" cy="141" rx="6" ry="3.5" transform="rotate(35 381 141)" fill="#ECCFC6" stroke="#C77A73"/>
                                <ellipse cx="353" cy="118" rx="6.5" ry="3.5" transform="rotate(-20 353 118)" fill="#ECCFC6" stroke="#C77A73"/>
                                <ellipse cx="343" cy="150" rx="5.5" ry="3" transform="rotate(-40 343 150)" fill="#FAF4F0" stroke="#C77A73"/>
                            </g>

                            <!-- Ground shadow under gift box -->
                            <ellipse cx="220" cy="252" rx="108" ry="12" fill="#D8C7BF" opacity="0.5"/>

                            <!-- Gift Box Base -->
                            <rect x="136" y="130" width="168" height="118" rx="10" fill="url(#boxBodyGrad)" stroke="#C8B5AD" stroke-width="1.5"/>
                            <!-- Subtle interior panel -->
                            <rect x="148" y="142" width="144" height="94" rx="6" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>

                            <!-- Vertical Satin Ribbon on Box -->
                            <rect x="206" y="130" width="28" height="118" fill="url(#roseRibbonGrad)" opacity="0.92"/>

                            <!-- Gift Box Lid -->
                            <rect x="126" y="102" width="188" height="32" rx="8" fill="url(#boxLidGrad)" stroke="#C8B5AD" stroke-width="1.5"/>
                            <rect x="206" y="102" width="28" height="32" fill="url(#roseRibbonGrad)"/>

                            <!-- Bow Loops & Center Knot -->
                            <path d="M220 102 C194 98, 174 74, 188 62 C202 52, 218 82, 220 102 Z" fill="#ECCFC6" stroke="#C77A73" stroke-width="1.6"/>
                            <path d="M220 102 C246 98, 266 74, 252 62 C238 52, 222 82, 220 102 Z" fill="#ECCFC6" stroke="#C77A73" stroke-width="1.6"/>
                            <circle cx="220" cy="100" r="8.5" fill="url(#roseRibbonGrad)" stroke="#FAF4F0" stroke-width="1.5"/>

                            <!-- Horizontal Ribbon Banner across Box ("Gift Boxes" motif from Page 09 prototype) -->
                            <path d="M104 176 L132 170 L132 198 L104 204 L114 190 Z" fill="#B66A64"/>
                            <path d="M336 176 L308 170 L308 198 L336 204 L326 190 Z" fill="#B66A64"/>
                            <rect x="122" y="166" width="196" height="34" rx="17" fill="#FAF4F0" stroke="#C77A73" stroke-width="1.5"/>
                            <text x="220" y="188" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="500" letter-spacing="1.6" fill="#1D1516">GIFT BOXES</text>

                            <!-- Subtle Fragrance Vial Silhouettes Peeking / Flanking -->
                            <rect x="155" y="198" width="16" height="36" rx="4" fill="#F6ECE5" stroke="#D8C7BF" stroke-width="1" opacity="0.65"/>
                            <rect x="269" y="198" width="16" height="36" rx="4" fill="#F6ECE5" stroke="#D8C7BF" stroke-width="1" opacity="0.65"/>
                        </svg>

                        <!-- Signature 4-Point Sparkle Accent (Matches 01. homepage.html) -->
                        <div class="hero-sparkle" aria-hidden="true">
                            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16 0C16 8.83656 23.1634 16 32 16C23.1634 16 16 23.1634 16 32C16 23.1634 8.83656 16 0 16C8.83656 16 16 8.83656 16 0Z" fill="#FFFDF8"/>
                                <circle cx="16" cy="16" r="3.5" fill="#FFE5DC"/>
                            </svg>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Scroll target for "Explore Collection" until Exclusive Collection section is implemented -->
        <div id="exclusive-collection" class="collection-anchor-placeholder" aria-hidden="true"></div>
    </main>

    <!-- Scripts -->
    <script src="../js/script.js"></script>
    <script src="../js/gift-sets.js"></script>
</body>
</html>
